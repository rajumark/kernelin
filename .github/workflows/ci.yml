name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # naga (from the wgpu project) validates every generated WGSL shader in the compiler tests.
      - name: Cache naga
        id: naga-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-30-${{ runner.os }}
      - name: Install naga
        if: steps.naga-cache.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version 30.0.1 --locked

      # GPU differential tests run every test kernel on the CPU and, through WebGPU in Deno, on a GPU.
      # CI machines have no GPU, so lavapipe (Mesa's software Vulkan driver) plays the GPU.
      - name: Install software GPU (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check WebGPU sees a GPU
        run: deno run --unstable-webgpu --allow-read --allow-write --allow-env kernelin-compiler-plugin/src/test/js/gpu-run.mjs --probe

      - name: Build and test (GPU tests required)
        env:
          KERNELIN_REQUIRE_GPU: "1"
        run: ./gradlew build --stacktrace

      - name: Incremental builds pick up kernel changes
        run: scripts/check-incremental.sh

      - name: Example - plain JVM project using the Gradle plugin
        working-directory: examples/hello-jvm
        run: ../../gradlew run --stacktrace

      - name: Example - Multiplatform project (JVM + Wasm)
        working-directory: examples/hello-multiplatform
        run: ../../gradlew jvmRun compileProductionExecutableKotlinWasmJs --stacktrace
