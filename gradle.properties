org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official

# Kernelin builds with JDK 21 (see gradle/gradle-daemon-jvm.properties and jvmToolchain(21)).
# Homebrew's openjdk@21 is not registered with /usr/libexec/java_home, so point Gradle at it.
# Paths that do not exist on a machine are ignored.
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
org.gradle.java.installations.auto-download=false

# ---- Published coordinates: implementation("$GROUP:<POM_ARTIFACT_ID>:$VERSION_NAME") ----
GROUP=io.github.rajumark
VERSION_NAME=0.1.0

# ---- POM metadata shared by every module (required by Maven Central); each module sets its own
# POM_ARTIFACT_ID / POM_NAME / POM_DESCRIPTION in its gradle.properties ----
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/rajumark/kernelin
POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/rajumark/kernelin
POM_SCM_CONNECTION=scm:git:git://github.com/rajumark/kernelin.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/rajumark/kernelin.git
POM_DEVELOPER_ID=rajumark
POM_DEVELOPER_NAME=rajumark
POM_DEVELOPER_URL=https://github.com/rajumark
