org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official

# Kernelin builds with JDK 21 (see gradle/gradle-daemon-jvm.properties and jvmToolchain(21)).
# Homebrew's openjdk@21 is not registered with /usr/libexec/java_home, so point Gradle at it.
# Paths that do not exist on a machine are ignored.
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
org.gradle.java.installations.auto-download=false
