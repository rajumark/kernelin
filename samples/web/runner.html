<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kernelin GPU Runner</title>
<style>
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #37352f; background: #fff; margin: 24px; }
  table { border-collapse: collapse; margin-top: 12px; }
  th, td { border-bottom: 1px solid #e9e9e7; padding: 4px 10px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  .ok { color: #0f7b6c; } .bad { color: #e03e3e; }
  pre { background: #f7f6f3; padding: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<h3>Kernelin GPU runner</h3>
<div id="status">starting...</div>
<table id="results"><thead><tr>
  <th>case</th><th>size</th><th>GPU kernel ms</th><th>GPU end-to-end ms</th><th>CPU 1 core ms</th><th>CPU all cores ms</th><th>correct</th>
</tr></thead><tbody></tbody></table>
<pre id="log"></pre>
<script>
// Runs every kernel exported by `./gradlew :samples:bench` on WebGPU, using only the
// .wgsl + .json manifest that the Kernelin compiler plugin generated.
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
const status = (m) => { document.getElementById('status').textContent = m; };
const median = (xs) => [...xs].sort((a, b) => a - b)[Math.floor(xs.length / 2)];

async function fetchBin(url, isInt) {
  const buf = await (await fetch(url)).arrayBuffer();
  return isInt ? new Int32Array(buf) : new Float32Array(buf);
}

async function runCase(device, c) {
  const manifest = await (await fetch(c.kernel + '.json')).json();
  const code = await (await fetch(c.kernel + '.wgsl')).text();
  const module = device.createShaderModule({ code });
  const info = await module.getCompilationInfo();
  const errors = info.messages.filter((m) => m.type === 'error');
  if (errors.length) throw new Error('WGSL rejected: ' + errors.map((e) => e.message).join('; '));

  const buffers = manifest.params.filter((p) => p.kind === 'buffer');
  const scalars = manifest.params.filter((p) => p.kind === 'scalar');
  const layout = device.createBindGroupLayout({ entries: [
    { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
    ...buffers.map((b) => ({ binding: b.binding, visibility: GPUShaderStage.COMPUTE,
      buffer: { type: b.access === 'read' ? 'read-only-storage' : 'storage' } })),
  ] });
  const pipeline = device.createComputePipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts: [layout] }),
    compute: { module, entryPoint: manifest.entryPoint },
  });

  // Uniform: kernelin_size (u32) then each scalar parameter in order, 4 bytes each.
  const uniformBytes = Math.ceil((1 + scalars.length) * 4 / 16) * 16;
  const uniformData = new ArrayBuffer(uniformBytes);
  const dv = new DataView(uniformData);
  dv.setUint32(0, c.size, true);
  scalars.forEach((s, i) => {
    const v = c.scalars[s.name];
    if (s.type === 'f32') dv.setFloat32(4 + i * 4, v, true);
    else if (s.type === 'bool') dv.setUint32(4 + i * 4, v ? 1 : 0, true);
    else dv.setInt32(4 + i * 4, v, true);
  });
  const uniform = device.createBuffer({ size: uniformBytes, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(uniform, 0, uniformData);

  const host = {};
  const gpu = {};
  for (const b of buffers) {
    const isInt = b.type === 'i32';
    const len = c.lengths[b.name];
    host[b.name] = c.inputs[b.name] ? await fetchBin(c.inputs[b.name], isInt) : (isInt ? new Int32Array(len) : new Float32Array(len));
    gpu[b.name] = device.createBuffer({ size: len * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });
  }
  const bindGroup = device.createBindGroup({ layout, entries: [
    { binding: 0, resource: { buffer: uniform } },
    ...buffers.map((b) => ({ binding: b.binding, resource: { buffer: gpu[b.name] } })),
  ] });

  const groups = Math.ceil(c.size / manifest.workgroupSize);
  const gx = Math.min(groups, device.limits.maxComputeWorkgroupsPerDimension);
  const gy = Math.ceil(groups / gx);
  const encodeDispatches = (encoder, count) => {
    const pass = encoder.beginComputePass();
    pass.setPipeline(pipeline);
    pass.setBindGroup(0, bindGroup);
    for (let i = 0; i < count; i++) pass.dispatchWorkgroups(gx, gy);
    pass.end();
  };
  const outputs = buffers.filter((b) => b.access === 'read_write');
  const staging = Object.fromEntries(outputs.map((b) => [b.name,
    device.createBuffer({ size: c.lengths[b.name] * 4, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST })]));

  const upload = () => { for (const b of buffers) device.queue.writeBuffer(gpu[b.name], 0, host[b.name]); };

  // End-to-end: upload inputs, run once, copy results back to JS.
  const endToEnd = async () => {
    const t0 = performance.now();
    upload();
    const encoder = device.createCommandEncoder();
    encodeDispatches(encoder, 1);
    for (const b of outputs) encoder.copyBufferToBuffer(gpu[b.name], 0, staging[b.name], 0, c.lengths[b.name] * 4);
    device.queue.submit([encoder.finish()]);
    const results = {};
    for (const b of outputs) {
      await staging[b.name].mapAsync(GPUMapMode.READ);
      const raw = staging[b.name].getMappedRange().slice(0);
      staging[b.name].unmap();
      results[b.name] = b.type === 'i32' ? new Int32Array(raw) : new Float32Array(raw);
    }
    return { ms: performance.now() - t0, results };
  };

  // Kernel only: data already on the GPU, many back-to-back dispatches, averaged.
  const kernelOnly = async (reps) => {
    const encoder = device.createCommandEncoder();
    encodeDispatches(encoder, reps);
    const t0 = performance.now();
    device.queue.submit([encoder.finish()]);
    await device.queue.onSubmittedWorkDone();
    return (performance.now() - t0) / reps;
  };

  for (let i = 0; i < 3; i++) await endToEnd();
  const e2e = [];
  let last;
  for (let i = 0; i < 5; i++) { last = await endToEnd(); e2e.push(last.ms); }
  await kernelOnly(3);
  const kernel = [];
  for (let i = 0; i < 5; i++) kernel.push(await kernelOnly(20));

  // Compare with the Kotlin CPU result.
  let total = 0, mismatches = 0, maxErr = 0;
  for (const b of outputs) {
    const expected = await fetchBin(c.expected[b.name], b.type === 'i32');
    const got = last.results[b.name];
    for (let i = 0; i < expected.length; i++) {
      total++;
      if (b.type === 'i32') { if (got[i] !== expected[i]) mismatches++; }
      else {
        const err = Math.abs(got[i] - expected[i]);
        maxErr = Math.max(maxErr, err);
        if (!(err <= 1e-4 * (1 + Math.abs(expected[i])))) mismatches++;
      }
    }
  }
  return {
    name: c.name, size: c.size,
    gpuKernelMs: median(kernel), gpuEndToEndMs: median(e2e),
    cpuSingleMs: c.cpu.singleMs, cpuParallelMs: c.cpu.parallelMs,
    matchPct: 100 * (total - mismatches) / total, maxAbsErr: maxErr,
    wgslLines: code.split('\n').length,
  };
}

(async () => {
  try {
    if (!navigator.gpu) throw new Error('WebGPU is not available in this browser');
    const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
    const device = await adapter.requestDevice({ requiredLimits: {
      maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
      maxBufferSize: adapter.limits.maxBufferSize,
    } });
    device.addEventListener('uncapturederror', (e) => log('GPU error: ' + e.error.message));
    const cases = await (await fetch('cases.json')).json();
    const results = [];
    for (const c of cases) {
      status('running ' + c.name + '...');
      const r = await runCase(device, c);
      results.push(r);
      const row = document.createElement('tr');
      const cls = r.matchPct >= 99.9 ? 'ok' : 'bad';
      row.innerHTML = `<td>${r.name}</td><td>${r.size.toLocaleString()}</td><td>${r.gpuKernelMs.toFixed(2)}</td>` +
        `<td>${r.gpuEndToEndMs.toFixed(2)}</td><td>${r.cpuSingleMs.toFixed(2)}</td><td>${r.cpuParallelMs.toFixed(2)}</td>` +
        `<td class="${cls}">${r.matchPct.toFixed(3)}%</td>`;
      document.querySelector('#results tbody').appendChild(row);
    }
    const ai = adapter.info || {};
    window.kernelinResults = { gpu: { vendor: ai.vendor, architecture: ai.architecture, device: ai.device, description: ai.description },
      userAgent: navigator.userAgent, results };
    status('done');
  } catch (e) {
    status('failed: ' + e.message);
    window.kernelinResults = { error: String(e.stack || e) };
  }
  // scripts/bench-android.sh serves this page and saves what we POST; plain static servers just ignore it.
  fetch('results', { method: 'POST', body: JSON.stringify(window.kernelinResults) }).catch(() => {});
})();
</script>
</body>
</html>
